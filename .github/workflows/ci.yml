name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Platform.sln

      - name: Build
        run: dotnet build src/Platform.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Platform.sln --no-build --configuration Release

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ai-service/requirements.txt

      - name: Lint
        run: ruff check ai-service

      - name: Test
        run: pytest ai-service
