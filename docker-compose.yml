services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: event-platform-postgres
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - event_platform_postgres_alpine_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  rabbitmq:
    build:
      context: .
      dockerfile: docker/rabbitmq.Dockerfile
    container_name: event-platform-rabbitmq
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_v4_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  ai-service:
    build: ./ai-service
    container_name: event-platform-ai-service
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
  api:
    build:
      context: .
      dockerfile: src/Platform/API/Dockerfile
    container_name: event-platform-api
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      JOBS_DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME:-jobs.submitted}
      APPLY_MIGRATIONS: "true"
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-2}
      RATE_LIMIT_TOKENS: ${RATE_LIMIT_TOKENS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:5200:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  worker:
    build:
      context: .
      dockerfile: src/Platform/Worker/Dockerfile
    container_name: event-platform-worker
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      JOBS_DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME:-jobs.submitted}
      RABBITMQ_DLQ_NAME: ${RABBITMQ_DLQ_NAME:-jobs.submitted.dlq}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-4}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  event_platform_postgres_data:
  event_platform_postgres_alpine_data:
  rabbitmq_data:
  rabbitmq_v4_data:
